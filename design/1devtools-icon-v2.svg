<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B16"/>
      <stop offset="100%" stop-color="#191A3A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6BFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bgGrad)"/>
  <circle cx="100" cy="88" r="80" fill="url(#glow)"/>

  <!-- prompt chevron ">" merging into numeral "1" — bolder, larger, centered -->
  <path d="M52 55 L108 100 L52 145" fill="none" stroke="url(#accentGrad)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 55 L126 70" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round"/>
  <rect x="139" y="45" width="22" height="110" rx="11" fill="url(#accentGrad)"/>

  <!-- blinking cursor / underscore -->
  <rect x="52" y="160" width="109" height="16" rx="8" fill="url(#accentGrad)"/>
</svg>
